<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" role="img" aria-labelledby="supkaArtTitle supkaArtDesc">
  <title id="supkaArtTitle">SUPKA on Apple Watch and iPhone</title>
